services:
  planilha-pro:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3030
      - NODE_ENV=production
      - CORS_ORIGIN
      - AUTH_USERNAME
      - AUTH_PASSWORD
      - SESSION_SECRET
      - SESSION_TTL_DAYS
      - DATA_DIR=/data
    volumes:
      - planilha-data:/data
    expose:
      - "3030"

volumes:
  planilha-data:
